<!DOCTYPE html>
<html>
	<head lang="en-AU">
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1.0" />

		<title>Unsanitize HTML</title>

		<link href="style.css" rel="stylesheet" type="text/css" />
		<link rel="stylesheet" href="lib/bootstrap-icons/font/bootstrap-icons.min.css" />
		<link rel="stylesheet" href="lib/highlight/styles/vs2015.css" />
		<style>
			textarea#input {
				width: 100%;
				height: 60vh;
				font-family: monospace;
			}
		</style>
	</head>
	<body>
		<main class="container-fluid" role="main">
			<h2>Unsanitize HTML</h2>
			<hr/>
			<div class="row align-items-start">
				<div class="col is-50 is-full-mobile">
					<h4>Input</h4>
					<textarea id="input"></textarea>
					<div class="row">
						<div class="col-auto">
							<button class="btn btn-primary" id="generate">Generate</button>
						</div>
						<div class="col-auto">
							<button class="btn btn-secondary" id="copy-output">
								<i class="bi bi-copy"></i>
								Copy Output
							</button>
						</div>
						<div class="col-auto">
							<div class="form-check">
								<input class="form-check-input" type="checkbox" value="" id="cbFormat">
								<label class="form-check-label" for="cbFormat">
								Format HTML?
								</label>
							</div>
						</div>
					</div>
				</div>
				<div class="col is-50 is-full-mobile">
					<h4>Output</h4>
					<pre class="code-content"><code class="language-xml" id="output"></code></pre>
				</div>
			</div>
		</main>
	</body>
	<script src="lib/highlight/highlight.min.js"></script>
    <script type="text/javascript" src="unsanitize.js"></script>
</html>
